name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxkbcommon-dev libdbus-1-dev libpipewire-0.3-dev libegl-dev libgl-dev libgbm-dev libvulkan-dev xvfb xterm

      - run: cargo build --release -p teasr
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Add teasr to PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

      - name: Install fonts
        run: |
          teasr setup --fonts "Monaspace Nerd Font"

      - name: Dogfood
        run: xvfb-run --auto-servernum --server-args "-screen 0 1280x720x24" teasr run --scenes web,terminal --verbose --timeout 60000

      - name: Upload showcase
        uses: actions/upload-artifact@v7
        with:
          name: showcase
          path: showcase/
          if-no-files-found: error
