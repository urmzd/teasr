[package]
name = "teasr-core"
description = "Core orchestration and capture for teasr"
version = "0.20.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anstyle-parse = "0.2"
resvg = "0.45"
tiny-skia = "0.11"
streamsafe = { version = "0.3", default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
crossterm.workspace = true
indicatif.workspace = true
chromiumoxide = { version = "0.9", default-features = false }
xcap = "0.9"
portable-pty = "0.9"
gifski = { version = "1", default-features = false }
imgref = "1"
rgb = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
async-trait = "0.1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
comrak = { version = "0.36", default-features = false, features = ["syntect"] }

libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }

[[bench]]
name = "capture"
harness = false

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
